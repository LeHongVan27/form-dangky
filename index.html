<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FORM ĐĂNG KÝ</title>
    <style>
        input:required:invalid, 
    textarea:required:invalid {
        border: 2px solid #b30000;
        outline: none;
    </style>
    </head>
    <body>
        <h2>Form đăng ký sinh viên</h2>
        <form action="#" method="POST">
        <div>
            <label>Họ tên:</label>
            <input type="text" name="fullname" placeholder="Họ và tên" required>
        </div><br>
        <div>
            <label>Email:</label>
            <input type="email" name="email" placeholder="Email" required>
        </div><br>
        <div>
            <label>Mật khẩu:</label>
            <input type="password" name="password" placeholder="Nhập mật khẩu">
        </div><br>
        <div>
            <label>Giới tính:</label>
            <input type="radio" id="nam" name="gender" value="Nam"> <label for="nam">Nam</label>

            <input type="radio" id="nu" name="gender" value="Nữ"> <label for="nu">Nữ</label>
        </div><br>
        <div>
            <label>Sở thích:</label>
            <input type="checkbox" id="sports" name="hobbies"> <label for="sports">Thể thao</label>

            <input type="checkbox" id="music" name="hobbies"> <label for="music">Âm nhạc</label>

            <input type="checkbox" id="game" name="hobbies"> <label for="game">Game</label>

            <input type="checkbox" id="travel" name="hobbies"> <label for="travel">Du lịch</label>
        </div><br>
        <div>
            <label>Ngành học:</label>
            <select name="major">
                <option value="">-- Chọn ngành học --</option>

                <option value="CNTT">Công nghệ thông tin</option>

                <option value="Kinh tế">Kinh tế</option>

                <option value="Điện tử">Điện tử</option>
                
                <option value="An toàn thông tin">An toàn thông tin</option>
            </select>
        </div><br>
        <div>
            <label>Ghi chú:</label><br>
            <textarea name="note" rows="4" cols="30" placeholder="Nhập ghi chú"></textarea>
        </div><br>
        <div>
            <button type="submit">Xác nhận</button>
        </div>
        </form>
    </body>
</html>
