<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM ĐĂNG KÝ SINH VIÊN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <div class="badge">Đăng ký mới</div>
        <h2>Form đăng ký sinh viên</h2>
        <form action="#" method="POST">
            <div class="row-group">
                <div class="form-group">
                    <label class="form-label">Họ tên:</label>
                    <input type="text" name="fullname" placeholder="Họ và tên" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email:</label>
                    <input type="email" name="email" placeholder="Email" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Mật khẩu:</label>
                <input type="password" name="password" placeholder="Nhập mật khẩu">
            </div>
            <div class="form-group">
                <label class="form-label">Giới tính:</label>
                <div class="inline-group">
                    <label class="inline-item" for="nam">
                        <input type="radio" id="nam" name="gender" value="Nam"> Nam
                    </label>
                    <label class="inline-item" for="nu">
                        <input type="radio" id="nu" name="gender" value="Nữ"> Nữ
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Sở thích:</label>
                <div class="inline-group">
                    <label class="inline-item" for="sports">
                        <input type="checkbox" id="sports" name="hobbies"> Thể thao
                    </label>
                    <label class="inline-item" for="music">
                        <input type="checkbox" id="music" name="hobbies"> Âm nhạc
                    </label>
                    <label class="inline-item" for="game">
                        <input type="checkbox" id="game" name="hobbies"> Game
                    </label>
                    <label class="inline-item" for="travel">
                        <input type="checkbox" id="travel" name="hobbies"> Du lịch
                    </label>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Ngành học:</label>
                <select name="major">
                    <option value="">-- Chọn ngành học --</option>
                    <option value="CNTT">Công nghệ thông tin</option>
                    <option value="Kinh tế">Kinh tế</option>
                    <option value="Điện tử">Điện tử</option>
                    <option value="An toàn thông tin">An toàn thông tin</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Ghi chú:</label>
                <textarea name="note" placeholder="Nhập ghi chú"></textarea>
            </div>

            <div class="button-group">
                <button type="submit">Đăng ký</button>
            </div>
        </form>
    </div>
</body>
</html>
